name: Scheduled Data Ingestion

on:
  schedule:
    - cron: '0 * * * *' # Otomatis jalan setiap jam (menit ke-0)
  workflow_dispatch:     # Supaya ada tombol "Run workflow" manual di GitHub

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Ingestion Script
        run: python src/ingest_data.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto(ingest): fetch latest btc raw data" && git push)