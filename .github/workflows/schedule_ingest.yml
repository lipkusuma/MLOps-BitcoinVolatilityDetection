name: Scheduled Data Ingestion

on:
  schedule:
    - cron: '0 * * * *' # Jalan otomatis setiap jam (menit ke-0)
  workflow_dispatch:     # Bisa dijalankan manual via tombol

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Ingestion Script
        run: python src/ingest_data.py

      - name: Upload Ingested Data as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-raw-data-${{ github.run_number }}
          path: data/raw/
          retention-days: 7 # Data artifact disimpan di GitHub selama 7 hari