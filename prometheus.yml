global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "bitcoin-volatility-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "127.0.0.1:8081"
          - "127.0.0.1:8082"
          - "127.0.0.1:8083"
        labels:
          service: "api-service"
          environment: "production"