services:
  mlflow-server:
    image: bitcoin-mlops:latest
    container_name: mlflow-tracking-server
    command: >
      mlflow server
      --backend-store-uri sqlite:////workspaces/MLOps-BitcoinVolatilityDetection/mlflow_store/mlflow.db
      --default-artifact-root /workspaces/MLOps-BitcoinVolatilityDetection/mlruns
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts "*"
      --cors-allowed-origins "*"
    environment:
      - DAGSHUB_REPO_OWNER=lipkusuma
      - DAGSHUB_REPO_NAME=MLOps-BitcoinVolatilityDetection
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN:-}
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db-data:/workspaces/MLOps-BitcoinVolatilityDetection/mlflow_store
      - mlflow-artifacts-data:/workspaces/MLOps-BitcoinVolatilityDetection/mlruns
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api-service:
    image: bitcoin-mlops-monitored:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081-8083:8080"
    deploy:
      mode: replicated
      replicas: 3
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mlflow-server:
        condition: service_healthy
    networks:
      - mlops-network

  nginx-lb:
    image: nginx:alpine
    container_name: bitcoin-volatility-lb
    network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-service:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: bitcoin-volatility-prometheus
    network_mode: "host"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2d"
      - "--web.listen-address=:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api-service:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bitcoin-volatility-grafana
    network_mode: "host"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge

volumes:
  mlflow-db-data:
    driver: local
  mlflow-artifacts-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local